<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antony Taylor</title>
<meta name="description" content="i build companies.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --ink: #16181a;
    --muted: #6b6f76;
    --line: #e2e0dc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8vh 24px;
    line-height: 1.6;
  }

  main {
    width: 100%;
    max-width: 480px;
  }

  .mark {
    width: 44px;
    height: 44px;
    display: block;
    margin-bottom: 48px;
  }

  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: clamp(24px, 4vw, 30px);
    letter-spacing: -0.01em;
    margin-bottom: 40px;
  }

  .cursor {
    display: inline-block;
    animation: blink 1.1s step-end infinite;
  }

  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }

  section {
    margin-bottom: 32px;
  }

  .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  ul {
    list-style: none;
  }

  li {
    position: relative;
    padding-left: 16px;
    font-size: 16px;
    margin-bottom: 8px;
  }

  li::before {
    content: "\2014";
    position: absolute;
    left: 0;
    color: var(--muted);
  }

  .advise p {
    font-size: 16px;
    margin-bottom: 8px;
  }

  hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 40px 0 24px;
  }

  .links {
    display: flex;
    gap: 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
  }

  a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 1px;
  }

  a:hover {
    color: var(--muted);
    border-color: var(--muted);
  }

  a:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }
</style>
</head>
<body>
  <main>
    <img class="mark" src="at-mark.png" alt="Antony Taylor">

    <h1>i build companies.<span class="cursor">_</span></h1>

    <section>
      <p class="label">right now</p>
      <ul>
        <li>bootstrapping a newco</li>
        <li>rebuilding an oldco i built once already (solo, using ai)</li>
        <li><a href="https://manntalabs.com" target="_blank" rel="noopener">advising</a> founders who may be stuck</li>
        <li><a href="https://manntalabs.com" target="_blank" rel="noopener">advising</a> ceos transforming their cos with ai</li>
      </ul>
    </section>

    <hr>

    <nav class="links">
      <a href="https://x.com/anttayl0r" target="_blank" rel="noopener">x</a>
      <a href="https://www.linkedin.com/in/antonytaylor/" target="_blank" rel="noopener">linkedin</a>
    </nav>
  </main>
</body>
</html>
